server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------
    # SPA: qualquer caminho que não exista como arquivo cai no
    # index.html. O app não usa react-router (é página única com
    # âncoras #), mas o fallback mantém links diretos funcionando.
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html NUNCA deve ficar em cache: é ele que aponta
    # para os assets com hash. Cache quebrado = site servindo
    # bundle velho depois do deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Assets têm hash no nome (index-a1b2c3.js) — podem ser
    # cacheados para sempre com segurança.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon e demais arquivos da raiz: cache curto.
    location ~* \.(?:svg|ico|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;
}
